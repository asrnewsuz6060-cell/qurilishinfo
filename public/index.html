<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QurilishInfo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            qblue: '#0b4f7c',
            qnavy: '#073b61',
            qgreen: '#138a5b'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
  
  <!-- Header -->
  <header class="sticky top-0 z-30 border-b bg-white/95 backdrop-blur dark:border-gray-800 dark:bg-gray-950/95">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4">
      <a href="#" class="flex items-center gap-2 text-xl font-bold text-qblue dark:text-white">
        <span>🏠</span>
        <span>Qurilish<span class="text-qgreen">Info</span></span>
      </a>

      <div class="flex items-center gap-2">
        <button id="themeButton" class="rounded-lg border px-3 py-2 text-sm dark:border-gray-700">
          🌙
        </button>
        <button id="langButton" class="rounded-lg border px-3 py-2 text-sm font-bold dark:border-gray-700">
          UZ
        </button>
        <a href="/admin.html" class="rounded-lg border px-3 py-2 text-sm font-bold dark:border-gray-700">
          Admin
        </a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-8">
    
    <!-- Hero -->
    <section id="hero" class="mb-8 rounded-2xl bg-gradient-to-r from-qblue to-qgreen p-8 text-white">
      <h1 class="text-3xl font-bold">QurilishInfo'ga xush kelibsiz</h1>
      <p class="mt-2">Maqolalarni admin panel orqali qo'shing</p>
    </section>

    <!-- Categories -->
    <section class="mb-8">
      <h2 class="mb-4 text-2xl font-bold">Ruknlar</h2>
      <div id="categoriesGrid" class="grid grid-cols-2 gap-3 md:grid-cols-3 lg:grid-cols-6"></div>
    </section>

    <!-- Articles -->
    <section>
      <h2 class="mb-4 text-2xl font-bold">Maqolalar</h2>
      <div id="articlesGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>

  </main>

  <script>
    const state = {
      articles: [],
      categories: [],
      settings: {},
      lang: 'uz'
    };

    const $ = (id) => document.getElementById(id);

    function applyTheme(theme) {
      document.documentElement.classList.toggle('dark', theme === 'dark');
      localStorage.setItem('theme', theme);
    }

    function loadSite() {
      const lang = localStorage.getItem('lang') || 'uz';
      state.lang = lang;
      $('langButton').textContent = lang.toUpperCase();

      fetch('/api/site/categories?lang=' + lang)
        .then(r => r.json())
        .then(cats => {
          state.categories = cats;
          const grid = $('categoriesGrid');
          grid.innerHTML = cats.map(cat => `
            <button data-category="${cat.name}" class="rounded-xl border bg-white p-4 text-left dark:border-gray-800 dark:bg-gray-900">
              <span class="block text-lg font-bold">${cat.name}</span>
            </button>
          `).join('');

          grid.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
              loadArticles(btn.dataset.category);
            });
          });

          loadArticles('Barchasi');
        });

      fetch('/api/site/settings?lang=' + lang)
        .then(r => r.json())
        .then(s => {
          state.settings = s;
        });
    }

    function loadArticles(category) {
      const lang = state.lang;
      let url = '/api/site/articles?lang=' + lang;
      if (category && category !== 'Barchasi') {
        url += '&category=' + encodeURIComponent(category);
      }

      fetch(url)
        .then(r => r.json())
        .then(articles => {
          state.articles = articles;
          const grid = $('articlesGrid');
          
          if (!articles.length) {
            grid.innerHTML = '<p class="text-gray-500">Maqolalar yo\'q</p>';
            return;
          }

          grid.innerHTML = articles.map(article => {
            const title = lang === 'ru' ? article.title_ru : article.title_uz;
            const lead = lang === 'ru' ? article.lead_ru : article.lead_uz;
            
            return `
              <article class="rounded-xl border bg-white p-4 dark:border-gray-800 dark:bg-gray-900">
                <h3 class="text-lg font-bold">${title || 'Sarlavha yo\'q'}</h3>
                <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">${lead || ''}</p>
                <div class="mt-3 text-xs text-gray-500">
                  <span>${article.category_name_uz || article.category_name_ru}</span>
                </div>
              </article>
            `;
          }).join('');
        });
    }

    $('themeButton').addEventListener('click', () => {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
    });

    $('langButton').addEventListener('click', () => {
      const newLang = state.lang === 'uz' ? 'ru' : 'uz';
      state.lang = newLang;
      localStorage.setItem('lang', newLang);
      $('langButton').textContent = newLang.toUpperCase();
      loadSite();
    });

    // Initialize
    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);
    loadSite();
  </script>
</body>
</html>
